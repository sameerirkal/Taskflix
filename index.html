<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TASKFLIX - Simple and secure task management.">
    <title>TASKFLIX | Task Manager</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header class="app-header">
        <h1>TASKFLIX</h1>
        <p>Your tasks, organized.</p>
    </header>

    <main class="container">
        <section id="auth-section" class="card">
            <h2>Welcome to TASKFLIX</h2>
            <p>Sign in or create an account to manage your tasks.</p>

            <form id="auth-form">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                    minlength="8"
                >

                <div class="button-group">
                    <button type="submit" id="login-button">Sign In</button>
                    <button type="button" id="signup-button">Create Account</button>
                </div>
            </form>

            <p id="auth-message" role="status" aria-live="polite"></p>
        </section>

        <section id="task-section" class="card" hidden>
            <div class="section-heading">
                <h2>My Tasks</h2>
                <button type="button" id="logout-button">Sign Out</button>
            </div>

            <form id="task-form">
                <label for="task-description">Description</label>
                <input
                    type="text"
                    id="task-description"
                    name="description"
                    maxlength="500"
                    required
                >

                <label for="start-date">Start Date</label>
                <input type="date" id="start-date" name="startDate" required>

                <label for="start-time">Start Time</label>
                <input type="time" id="start-time" name="startTime" required>

                <label for="end-date">End Date</label>
                <input type="date" id="end-date" name="endDate" required>

                <label for="end-time">End Time</label>
                <input type="time" id="end-time" name="endTime" required>

                <button type="submit" id="save-task-button">Save Task</button>
            </form>

            <p id="task-message" role="status" aria-live="polite"></p>

            <section aria-labelledby="task-list-heading">
                <h3 id="task-list-heading">Task List</h3>
                <div id="task-list">
                    <p>Your tasks will appear here.</p>
                </div>
            </section>

            <section aria-labelledby="excel-heading">
                <h3 id="excel-heading">Excel Import and Export</h3>
                <p>Bulk import and EOD export will be added in a later step.</p>
            </section>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; <span id="current-year"></span> TASKFLIX</p>
    </footer>
</body>
</html>
