<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta
    name="description"
    content="TASKFLIX — A modern and secure task management application."
>

<meta name="theme-color" content="#0b0d12">

<title>TASKFLIX | Task Manager</title>

<!-- Web App Manifest -->
<link rel="manifest" href="manifest.json">

<!-- TASKFLIX Stylesheets -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/tasks.css">
<link rel="stylesheet" href="css/settings.css">

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Excel Library -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- TASKFLIX JavaScript Modules -->
<script src="js/supabase.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/dashboard.js" defer></script>
<script src="js/tasks.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/excel.js" defer></script>
<script src="js/notifications.js" defer></script>
<script src="js/cloud-tasks.js" defer></script>
<script src="js/service-worker-registration.js" defer></script>

</head>

<body>
    <header class="app-header">
        <div class="brand">
            <h1>TASKFLIX</h1>
            <p>Your tasks, organized.</p>
        </div>

        <div class="theme-control">
    <span id="theme-label">Dark Mode</span>

    <label class="switch" aria-label="Toggle dark and light theme">
        <div class="round">
            <input
                name="theme-toggle"
                id="theme-toggle"
                type="checkbox"
                role="switch"
                aria-label="Light theme"
                aria-checked="false"
            >

            <div class="back">
                <label for="theme-toggle" class="but">
                    <span class="on">I</span>
                    <span class="off">0</span>
                </label>
            </div>
        </div>
    </label>
</div>
    </header>

    <main class="container">
        <section id="auth-section" class="card">
            <h2>Welcome to TASKFLIX</h2>
            <p>Sign in or create an account to manage your tasks.</p>

            <form id="auth-form">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    minlength="8"
                    required
                >

                <div class="button-group">
                    <button type="submit" id="login-button">
                        Sign In
                    </button>

                    <button type="button" id="signup-button">
                        Create Account
                    </button>
                </div>
            </form>

            <p id="auth-message" role="status" aria-live="polite"></p>
        </section>

        <section id="task-section" class="card" hidden>
            <div class="section-heading">
                <h2>My Tasks</h2>

                <button type="button" id="logout-button">
                    Sign Out
                </button>
            </div>

            <form id="task-form">
                <label for="task-description">Description</label>
                <input
                    type="text"
                    id="task-description"
                    name="description"
                    maxlength="500"
                    required
                >

                <label for="start-date">Start Date</label>
                <input
                    type="date"
                    id="start-date"
                    name="startDate"
                    required
                >

                <label for="start-time">Start Time</label>
                <input
                    type="time"
                    id="start-time"
                    name="startTime"
                    required
                >

                <label for="end-date">End Date</label>
                <input
                    type="date"
                    id="end-date"
                    name="endDate"
                    required
                >

                <label for="end-time">End Time</label>
                <input
                    type="time"
                    id="end-time"
                    name="endTime"
                    required
                >

                <button type="submit" id="save-task-button">
                    Save Task
                </button>
            </form>

            <p id="task-message" role="status" aria-live="polite"></p>

            <section aria-labelledby="task-list-heading">
                <h3 id="task-list-heading">Task List</h3>

                <div id="task-list">
                    <p>Your tasks will appear here.</p>
                </div>
            </section>

            <section aria-labelledby="excel-heading">
                <h3 id="excel-heading">Excel Import and Export</h3>
                <p>Bulk import and EOD export will be added in a later step.</p>
            </section>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; <span id="current-year"></span> TASKFLIX</p>
    </footer>
</body>
</html>
